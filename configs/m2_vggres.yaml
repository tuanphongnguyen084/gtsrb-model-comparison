inherit: base.yaml
# M2 — VGG-like sâu từ số 0: 4 stage conv 3x3 + BN + residual + spatial dropout + GAP.
model:
  name: m2_vggres
  kwargs:
    base_channels: 32
    n_stages: 4
    width_mult: 1.0
    spatial_dropout: [0.1, 0.2, 0.3, 0.3]
    head_dropout: 0.5
    use_bn: true            # 3 cờ này để ablation nội bộ:
    use_residual: true      #   bỏ từng cái một để đo đóng góp
    use_spatial_dropout: true
train:
  epochs: 40
  lr: 0.001
