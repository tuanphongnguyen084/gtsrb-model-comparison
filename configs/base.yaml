# base.yaml — cấu hình gốc. Mọi config khác `inherit: base.yaml` và chỉ ghi phần KHÁC.
# QUY TẮC: mọi siêu tham số nằm ở đây, KHÔNG hard-code trong src/.

seed: 42
device: auto            # auto -> cuda > mps > cpu

data:
  index_csv: data/processed/index.csv
  processed_dir: data/processed
  img_size: 48          # 48x48 — khớp cấu hình bài vô địch IJCNN 2011
  cache_size: 48        # độ phân giải file cache .npy (M3 nội suy từ đây lên 224)
  preprocess: clahe     # none | he_gray | he_y | clahe
  normalize: gtsrb      # gtsrb (M1,M2) | imagenet (M3)
  aug_policy: geo_photo # none | geo | geo_photo | geo_photo_erase
  rotation_deg: 15.0    # CẤM flip ngang — xem src/gtsrb/data/transforms.py
  translate: 0.10
  zoom: [0.9, 1.1]
  jitter: 0.20
  val_ratio: 0.2
  group_by_track: true  # ★ true = chống rò rỉ dữ liệu. false CHỈ để đối chứng.
  # mean/std tính CHỈ trên tập train, do scripts/prepare_data.py ghi vào đây.
  mean: [0.4597, 0.4254, 0.4376]
  std: [0.2670, 0.2607, 0.2691]

model:
  name: m2_vggres
  kwargs: {}

train:
  epochs: 40
  batch_size: 128
  optimizer: adam       # adam | adamw | sgd
  lr: 0.001
  weight_decay: 0.0
  label_smoothing: 0.1  # 0 = tắt. Ablation: 0.0 / 0.1 / 0.2
  scheduler: cosine     # cosine | none
  warmup_epochs: 3
  min_lr_ratio: 0.01
  grad_clip: 1.0
  patience: 10          # early stopping theo val MACRO-F1
  amp: true             # tự tắt nếu không phải CUDA
  num_workers: 0        # 0 trên macOS (fork + OpenCV hay treo). Colab: 2-4.
