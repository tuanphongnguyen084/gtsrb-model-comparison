seed: 42
device: auto
data:
  index_csv: data/processed/index.csv
  processed_dir: data/processed
  img_size: 224
  cache_size: 48
  preprocess: clahe
  normalize: imagenet
  aug_policy: geo_photo
  rotation_deg: 15.0
  translate: 0.1
  zoom:
  - 0.9
  - 1.1
  jitter: 0.2
  val_ratio: 0.2
  group_by_track: true
  mean:
  - 0.4594
  - 0.426
  - 0.4383
  std:
  - 0.2654
  - 0.2596
  - 0.2685
model:
  name: m3_resnet18
  kwargs:
    pretrained: true
    head_dropout: 0.2
train:
  epochs: 15
  batch_size: 96
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.1
  scheduler: cosine
  warmup_epochs: 1
  min_lr_ratio: 0.01
  grad_clip: 1.0
  patience: 5
  amp: true
  num_workers: 2
  phases:
  - name: freeze_head
    epochs: 3
    freeze_backbone: true
    lr: 0.001
  - name: finetune_all
    epochs: 12
    freeze_backbone: false
    discriminative_lr:
      early: 1.0e-05
      middle: 0.0001
      head: 0.001
config_path: configs/m3_resnet18.yaml
